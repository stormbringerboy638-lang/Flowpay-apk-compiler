name: Sync Upstream & Release APK

on:
  schedule:
    # Checks for upstream updates every 24 hours at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Keeps manual trigger button

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Flowpayup/Payments-Without-Internet.git
          git fetch upstream main
          # Merge upstream into current branch
          if git merge upstream/main --no-edit; then
            echo "merged=true" >> $GITHUB_OUTPUT
            git push origin main
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "No new updates or merge conflict."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Flowpay APK - Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
